[package]
name = "apiary-app"
description = "Apiary: one SQLite hive per tenant, a live map of the fleet, a storm to churn it, and a durable offboarding that will not delete a hive it cannot restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "apiary-app"

[dependencies]
hive = { path = "../hive" }
anyhow = { workspace = true }
autumn-web = { workspace = true }
autumn-harvest = { workspace = true }
autumn-harvest-sqlite = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
maud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
autumn-web = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
